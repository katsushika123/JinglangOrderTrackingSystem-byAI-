appId: com.jinglang.order-tracking
productName: 订单跟踪系统
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - "!node_modules"
win:
  target:
    - nsis
asar: true
npmRebuild: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 订单跟踪系统
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
